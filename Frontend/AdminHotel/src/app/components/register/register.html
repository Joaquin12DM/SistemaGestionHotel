<div class="register-container">
  <h2>Registro</h2>
  <form (ngSubmit)="onRegister()" #registerForm="ngForm">
    <input 
      type="text" 
      name="username" 
      [(ngModel)]="registerData.username" 
      placeholder="Usuario" 
      [disabled]="isLoading"
      required 
    />
    <input 
      type="password" 
      name="password" 
      [(ngModel)]="registerData.password" 
      placeholder="Contraseña" 
      [disabled]="isLoading"
      required 
    />
    <input 
      type="text" 
      name="nombre" 
      [(ngModel)]="registerData.nombre" 
      placeholder="Nombre" 
      [disabled]="isLoading"
      required 
    />
    <input 
      type="text" 
      name="apellido" 
      [(ngModel)]="registerData.apellido" 
      placeholder="Apellido" 
      [disabled]="isLoading"
      required 
    />
    <button 
      type="submit" 
      [disabled]="isLoading"
    >
      {{ isLoading ? 'Registrando...' : 'Registrarse' }}
    </button>
  </form>
  <div *ngIf="registerError" class="error">{{ registerError }}</div>
  <div class="login-link">
    ¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión aquí</a>
  </div>
</div>
