<div class="px-40 flex flex-1 justify-center py-5">
  <div class="layout-content-container flex flex-col max-w-[960px] flex-1">
    <!-- Hero -->
    <div class="@container">
      <div class="@[480px]:p-4">
        <div
          class="flex min-h-[480px] flex-col gap-6 bg-cover bg-center bg-no-repeat @[480px]:gap-8 @[480px]:rounded-xl items-center justify-center p-4"
          style='background-image: linear-gradient(rgba(0, 0, 0, 0.1) 0%, rgba(0, 0, 0, 0.4) 100%), url("https://lh3.googleusercontent.com/aida-public/AB6AXuCfYbGaXAe7b_UkdgDdPrLR97vWnec6l1WU6TnOPpICW1Lq0-8MI37XGUeVxG_Tr6uzdaAadxpvECHABEsNTZ4EHckUj0Tb_rwtnvqWJTBZIfHZK8rBByt-jI4xAWbYJ5xWWFxNmjnHc2NsfE_Ec6PJCDf2ofx74CZhFzhZOXNArHo2-ZwklhYLhFbSLi3B_C6DGWJ256joOVwDTo0A2iYUUJ-iLICBqTFehvkk5l57tmibRKLTZ_wZH-HMFOZjwmpfiGykLQqdHCQM");'
        >
          <div class="flex flex-col gap-2 text-center">
            <h1
              class="text-white text-4xl font-black leading-tight tracking-[-0.033em] @[480px]:text-5xl"
            >
              Estamos aquí para ayudarte
            </h1>
            <h2 class="text-white text-sm font-normal @[480px]:text-base">
              Contáctanos con cualquier pregunta o consulta.
            </h2>
          </div>
        </div>
      </div>
    </div>

    <!-- Formulario -->
    <div class="flex max-w-[480px] flex-wrap items-end gap-4 px-4 py-3">
      <label class="flex flex-col min-w-40 flex-1">
        <p class="text-[#111418] text-base font-medium pb-2">Nombre completo</p>
        <input
          placeholder="Ingresa tu nombre completo"
          class="form-input flex w-full rounded-xl border border-[#dce0e5] h-14 p-[15px] text-base placeholder:text-[#637588]"
        />
      </label>
    </div>

    <div class="flex max-w-[480px] flex-wrap items-end gap-4 px-4 py-3">
      <label class="flex flex-col min-w-40 flex-1">
        <p class="text-[#111418] text-base font-medium pb-2">Correo electrónico</p>
        <input
          placeholder="Ingresa tu correo electrónico"
          class="form-input flex w-full rounded-xl border border-[#dce0e5] h-14 p-[15px] text-base placeholder:text-[#637588]"
        />
      </label>
    </div>

    <div class="flex max-w-[480px] flex-wrap items-end gap-4 px-4 py-3">
      <label class="flex flex-col min-w-40 flex-1">
        <p class="text-[#111418] text-base font-medium pb-2">Teléfono</p>
        <input
          placeholder="Ingresa tu teléfono"
          class="form-input flex w-full rounded-xl border border-[#dce0e5] h-14 p-[15px] text-base placeholder:text-[#637588]"
        />
      </label>
    </div>

    <div class="flex max-w-[480px] flex-wrap items-end gap-4 px-4 py-3">
      <label class="flex flex-col min-w-40 flex-1">
        <p class="text-[#111418] text-base font-medium pb-2">Asunto</p>
        <input
          placeholder="Ingresa el asunto"
          class="form-input flex w-full rounded-xl border border-[#dce0e5] h-14 p-[15px] text-base placeholder:text-[#637588]"
        />
      </label>
    </div>

    <div class="flex max-w-[480px] flex-wrap items-end gap-4 px-4 py-3">
      <label class="flex flex-col min-w-40 flex-1">
        <p class="text-[#111418] text-base font-medium pb-2">Mensaje</p>
        <textarea
          placeholder="Ingresa tu mensaje"
          class="form-input flex w-full rounded-xl border border-[#dce0e5] min-h-36 p-[15px] text-base placeholder:text-[#637588]"
        ></textarea>
      </label>
    </div>

    <div class="flex px-4 py-3 justify-start">
      <button
        class="flex min-w-[84px] cursor-pointer items-center justify-center rounded-xl h-10 px-4 bg-[#1980e6] text-white text-sm font-bold"
      >
        <span class="truncate">Enviar mensaje</span>
      </button>
    </div>

    <!-- Datos de contacto -->
    <h2 class="text-[#111418] text-[22px] font-bold px-4 pb-3 pt-5">Datos de contacto</h2>
    <p class="text-[#111418] text-base px-4">Dirección: Calle Principal 123, Trujillo, Perú</p>
    <p class="text-[#111418] text-base px-4">Teléfono: +1 (555) 123-4567</p>
    <p class="text-[#111418] text-base px-4">Correo electrónico: contacto@hoteldusk.com</p>
    <p class="text-[#111418] text-base px-4">Horarios de atención: Lunes a Viernes, 9 AM - 6 PM</p>

    <!-- Mapa -->

    <div class="flex px-4 py-3">
    <iframe
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d62829.56923444501!2d-79.0706485!3d-8.1090527!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x91ad17e7cf86f1f7%3A0x7b3c5d8d9b9e90a9!2sTrujillo%2C%20Per%C3%BA!5e0!3m2!1ses-419!2spe!4v1693335567890!5m2!1ses-419!2spe"
        width="100%"
        height="400"
        style="border:0; border-radius: 0.75rem;"
        allowfullscreen=""
        loading="lazy"
        referrerpolicy="no-referrer-when-downgrade">
    </iframe>
    </div>
  </div>
</div>
