<div class="flex flex-col items-center w-full">

  <!-- Hero sin barra de búsqueda -->
<div class="w-full h-[80vh] sm:h-[90vh] flex flex-col items-center justify-center bg-center bg-cover relative"
     style='background-image: linear-gradient(rgba(0,0,0,0.2), rgba(0,0,0,0.5)), url("https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1470&q=80");'>
  <div class="text-center text-white px-4 max-w-3xl">
    <h1 class="text-4xl sm:text-5xl font-black mb-4 leading-tight">Encuentra tu Habitacion perfecta</h1>
    <p class="text-sm sm:text-lg">Descubre una amplia variedad de heabitaciones que se adaptan a tus necesidades y presupuesto.</p>
  </div>
</div>

  <!-- Popular Rooms -->
<h2 class="text-gray-900 text-2xl font-bold mt-10 mb-4 w-full max-w-5xl px-4">
  Habitaciones populares
</h2>

<div *ngIf="cargando" class="px-4">Cargando habitaciones...</div>
<div *ngIf="error" class="px-4 text-red-500">{{ error }}</div>

<div class="flex overflow-x-auto gap-4 w-full max-w-5xl px-4 scrollbar-none py-2">
  <div
    *ngFor="let h of habitaciones"
    class="min-w-[15rem] flex flex-col gap-2"
  >
    <div
      class="aspect-video bg-cover bg-center rounded-lg"
      [style.background-image]="'url(' + h.imagenUrl + ')'"
    ></div>
    <p class="text-gray-900 font-medium">
      {{ h.tipo }} - Habitación {{ h.numero }}
    </p>
    <p class="text-gray-500 text-sm">{{ h.descripcion }}</p>
  </div>

  <!-- Ver más -->
  <div class="min-w-[15rem] flex flex-col gap-2">
    <a class="text-gray-900 font-medium" routerLink="/habitaciones">
      Ver más
    </a>
    <p class="text-gray-500 text-sm">Más Habitaciones</p>
  </div>
</div>

</div>
