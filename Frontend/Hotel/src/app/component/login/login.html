<div class="flex items-center justify-center min-h-screen bg-white">
  <div
    class="layout-content-container flex flex-col w-[512px] max-w-[512px] py-5 flex-1"
  >
    <h2
      class="text-[#111418] tracking-light text-[28px] font-bold leading-tight px-4 text-center pb-3 pt-5"
    >
      Welcome to LuxStay
    </h2>

    <div class="flex max-w-[480px] flex-wrap items-end gap-4 px-4 py-3">
      <label class="flex flex-col min-w-40 flex-1">
        <p class="text-[#111418] text-base font-medium leading-normal pb-2">
          Email
        </p>
        <input
          placeholder="Email"
          class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-xl text-[#111418] focus:outline-0 focus:ring-0 border border-[#dce0e5] bg-white focus:border-[#dce0e5] h-14 placeholder:text-[#637588] p-[15px] text-base font-normal leading-normal"
        />
      </label>
    </div>

    <div class="flex max-w-[480px] flex-wrap items-end gap-4 px-4 py-3">
      <label class="flex flex-col min-w-40 flex-1">
        <p class="text-[#111418] text-base font-medium leading-normal pb-2">
          Password
        </p>
        <input
          type="password"
          placeholder="Password"
          class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-xl text-[#111418] focus:outline-0 focus:ring-0 border border-[#dce0e5] bg-white focus:border-[#dce0e5] h-14 placeholder:text-[#637588] p-[15px] text-base font-normal leading-normal"
        />
      </label>
    </div>

    <p
      class="text-[#637588] text-sm font-normal leading-normal pb-3 pt-1 px-4 underline cursor-pointer"
    >
      Forgot password?
    </p>

    <div class="flex px-4 py-3">
      <button
        class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-xl h-12 px-5 flex-1 bg-[#1980e6] text-white text-base font-bold leading-normal tracking-[0.015em]"
      >
        <span class="truncate">Log in</span>
      </button>
    </div>

    <p
      class="text-[#637588] text-sm font-normal leading-normal pb-3 pt-1 px-4 text-center"
    >
      or
    </p>

    <div class="flex px-4 py-3">
      <button
        class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-xl h-12 px-5 flex-1 bg-[#f0f2f4] text-[#111418] text-base font-bold leading-normal tracking-[0.015em]"
      >
        <span class="truncate">Continue with social media</span>
      </button>
    </div>

    <p
      class="text-[#637588] text-sm font-normal leading-normal pb-3 pt-1 px-4 text-center underline cursor-pointer"
    >
      Don't have an account? Sign up
    </p>
  </div>
</div>
